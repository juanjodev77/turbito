<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbito - Juego de Kino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 1rem;
        }

        .app-header {
            background: linear-gradient(90deg, #0f3460 0%, #16213e 100%);
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid #e94560;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .app-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(233, 69, 96, 0.5);
            letter-spacing: 2px;
        }

        .app-header p {
            font-size: 1rem;
            color: #e94560;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* User Balance */
        .balance-card {
            background: linear-gradient(135deg, #e94560 0%, #c23049 100%);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid #ff6b7a;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .balance-card h3 {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
        }

        .winning-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #27ae60 0%, #229954 100%);
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            z-index: 1000;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* Draw Display */
        .draw-display {
            background: rgba(15, 52, 96, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #e94560;
        }

        .draw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .draw-header h2 {
            font-size: 1.3rem;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(233, 69, 96, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid #e94560;
        }

        .timer-label {
            font-weight: bold;
            color: #e94560;
            font-size: 0.9rem;
        }

        .timer-value {
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            min-width: 50px;
        }

        .drawn-numbers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 0.8rem;
        }

        .drawn-number {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e94560 0%, #c23049 100%);
            border: 2px solid #ff6b7a;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .no-draw {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        /* My Bet Section */
        .my-bet-section {
            background: rgba(15, 52, 96, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #e94560;
        }

        .my-bet-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #e94560;
        }

        .bet-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #533483;
            margin-bottom: 1rem;
        }

        .bet-amount-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(83, 52, 131, 0.3);
        }

        .bet-amount-label {
            font-weight: bold;
            color: #e94560;
        }

        .selected-numbers-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 0.6rem;
        }

        .selected-num-badge {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e94560 0%, #c23049 100%);
            border: 2px solid #ff6b7a;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .selected-num-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        .no-bet-yet {
            text-align: center;
            color: #999;
            padding: 1rem;
        }

        /* Game Board */
        .game-board {
            background: rgba(15, 52, 96, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #e94560;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .number-btn {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border: 2px solid #533483;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-btn:hover {
            background: linear-gradient(135deg, #533483 0%, #16213e 100%);
            border-color: #e94560;
            transform: scale(1.05);
        }

        .number-btn.selected {
            background: linear-gradient(135deg, #e94560 0%, #c23049 100%);
            border-color: #ff6b7a;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            transform: scale(1.1);
        }

        .bet-controls {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .selection-info {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #e94560;
            font-weight: bold;
        }

        .bet-amount-control {
            margin-bottom: 1.5rem;
        }

        .bet-amount-control label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .bet-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .bet-input-group input {
            flex: 1;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #533483;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        .bet-input-group input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .bet-quick-btn {
            padding: 0.75rem 1rem;
            background: #533483;
            border: 2px solid #533483;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .bet-quick-btn:hover {
            background: #e94560;
            border-color: #e94560;
        }

        .bet-label {
            display: block;
            text-align: center;
            color: #e94560;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(90deg, #e94560 0%, #c23049 100%);
            color: #fff;
            border: 2px solid #e94560;
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #533483;
            color: #fff;
            border: 2px solid #533483;
        }

        .btn-secondary:hover {
            background: #7a4fa3;
        }

        .btn-danger {
            background: rgba(255, 107, 122, 0.2);
            color: #ff6b7a;
            border: 2px solid #ff6b7a;
        }

        .btn-danger:hover {
            background: rgba(233, 69, 96, 0.3);
        }

        /* AI Players */
        .ai-players {
            background: rgba(15, 52, 96, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #533483;
        }

        .ai-players h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(83, 52, 131, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-card:hover {
            background: rgba(83, 52, 131, 0.2);
            border-color: #533483;
        }

        .player-card.expanded {
            background: rgba(83, 52, 131, 0.3);
            border-color: #e94560;
        }

        .player-name {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .player-balance {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .player-bet-info {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        .bet-win {
            color: #27ae60;
            font-weight: bold;
        }

        .player-numbers {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(83, 52, 131, 0.5);
        }

        .player-numbers h4 {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .player-numbers-display {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem;
        }

        .player-num {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(83, 52, 131, 0.5);
            border: 1px solid #533483;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .player-num.match {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border-color: #2ecc71;
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.4);
        }

        /* Game Stats */
        .game-stats {
            background: rgba(15, 52, 96, 0.8);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid #533483;
        }

        .game-stats h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.8rem;
            border-radius: 6px;
            border-left: 3px solid #533483;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stat-item:hover {
            background: rgba(83, 52, 131, 0.2);
        }

        .stat-item.win {
            border-left-color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
        }

        .stat-matches {
            font-weight: bold;
            color: #fff;
        }

        .stat-prize {
            color: #27ae60;
            font-weight: bold;
        }

        .stat-time {
            color: #999;
            font-size: 0.75rem;
            margin-top: 0.3rem;
        }

        .no-history {
            text-align: center;
            color: #666;
            padding: 1rem;
        }

        .stat-details {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(83, 52, 131, 0.3);
            font-size: 0.75rem;
        }

        .stat-details p {
            margin: 0.3rem 0;
            color: #ccc;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }

        @media (max-width: 768px) {
            .app-header h1 {
                font-size: 2rem;
            }

            .numbers-grid {
                grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>🎰 TURBITO</h1>
        <p>Juega, Gana, Disfruta</p>
    </div>

    <div class="container">
        <div class="main-content">
            <!-- Balance -->
            <div class="balance-card">
                <h3>Saldo Disponible</h3>
                <div class="balance-amount">S/ <span id="userBalance">10000</span></div>
            </div>

            <!-- Draw Display -->
            <div class="draw-display">
                <div class="draw-header">
                    <h2>Números Sorteados</h2>
                    <div class="timer">
                        <span class="timer-label">Próximo en:</span>
                        <span class="timer-value" id="timerValue">5:00</span>
                    </div>
                </div>
                <div class="drawn-numbers" id="drawnNumbers">
                    <div class="no-draw">Esperando primer sorteo...</div>
                </div>
            </div>

            <!-- My Current Bet -->
            <div class="my-bet-section">
                <h3>Mi Apuesta Actual</h3>
                <div id="myBetDisplay" class="no-bet-yet">
                    Selecciona 12 números para hacer una apuesta
                </div>
            </div>

            <!-- Game Board -->
            <div class="game-board">
                <div class="numbers-grid" id="numbersGrid"></div>

                <div class="bet-controls">
                    <div class="selection-info"><span id="selectedCount">0</span>/12 seleccionados</div>

                    <div class="bet-amount-control">
                        <label>Monto de Apuesta:</label>
                        <div class="bet-input-group">
                            <button class="bet-quick-btn" onclick="decreaseBet()">-</button>
                            <input type="number" id="betAmount" value="100" min="10" max="10000">
                            <button class="bet-quick-btn" onclick="increaseBet()">+</button>
                        </div>
                        <span class="bet-label">S/ <span id="betDisplay">100</span></span>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" id="bettingBtn" onclick="placeBet()">APOSTAR</button>
                        <button class="btn btn-secondary" onclick="autoSelect()">AUTO</button>
                        <button class="btn btn-danger" onclick="clearSelection()">LIMPIAR</button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <!-- AI Players -->
            <div class="ai-players">
                <h3>Jugadores IA</h3>
                <div class="players-list" id="aiPlayersList"></div>
            </div>

            <!-- Game Stats -->
            <div class="game-stats">
                <h3>Histórico</h3>
                <div class="stats-list" id="statsList">
                    <div class="no-history">Sin histórico aún</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Estado del juego
        let gameState = {
            selectedNumbers: [],
            userBalance: 10000,
            betAmount: 100,
            drawnNumbers: [],
            nextDrawTime: 300,
            gameHistory: [],
            userBets: [],
            aiPlayers: [
                { id: 1, name: 'IA - Player 1', balance: 50000, bets: [], numbers: [] },
                { id: 2, name: 'IA - Player 2', balance: 50000, bets: [], numbers: [] },
                { id: 3, name: 'IA - Player 3', balance: 50000, bets: [], numbers: [] },
                { id: 4, name: 'IA - Player 4', balance: 50000, bets: [], numbers: [] },
            ],
            expandedAI: null
        };

        // Inicializar grid de números
        function initNumbersGrid() {
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 24; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.onclick = () => toggleNumber(i);
                grid.appendChild(btn);
            }
        }

        // Seleccionar/deseleccionar número
        function toggleNumber(num) {
            if (gameState.selectedNumbers.includes(num)) {
                gameState.selectedNumbers = gameState.selectedNumbers.filter(n => n !== num);
            } else if (gameState.selectedNumbers.length < 12) {
                gameState.selectedNumbers.push(num);
                gameState.selectedNumbers.sort((a, b) => a - b);
            }
            updateUI();
        }

        // Selección automática
        function autoSelect() {
            gameState.selectedNumbers = generateRandomNumbers();
            updateUI();
        }

        // Limpiar selección
        function clearSelection() {
            gameState.selectedNumbers = [];
            updateUI();
        }

        // Generar números aleatorios
        function generateRandomNumbers() {
            const numbers = [];
            while (numbers.length < 12) {
                const num = Math.floor(Math.random() * 24) + 1;
                if (!numbers.includes(num)) numbers.push(num);
            }
            return numbers.sort((a, b) => a - b);
        }

        // Aumentar/disminuir apuesta
        function increaseBet() {
            gameState.betAmount = Math.min(gameState.betAmount + 50, 10000);
            updateUI();
        }

        function decreaseBet() {
            gameState.betAmount = Math.max(gameState.betAmount - 50, 10);
            updateUI();
        }

        // Realizar apuesta
        function placeBet() {
            if (gameState.selectedNumbers.length !== 12) {
                alert('Debes seleccionar exactamente 12 números');
                return;
            }
            if (gameState.betAmount > gameState.userBalance) {
                alert('No tienes suficiente saldo');
                return;
            }

            gameState.userBalance -= gameState.betAmount;
            gameState.userBets.push({
                numbers: [...gameState.selectedNumbers],
                amount: gameState.betAmount,
                timestamp: new Date()
            });
            gameState.selectedNumbers = [];
            updateUI();
            alert('¡Apuesta realizada! Espera el próximo sorteo.');
        }

        // Realizar sorteo
        function performDraw() {
            const drawn = [];
            while (drawn.length < 12) {
                const num = Math.floor(Math.random() * 24) + 1;
                if (!drawn.includes(num)) drawn.push(num);
            }
            drawn.sort((a, b) => a - b);
            gameState.drawnNumbers = drawn;

            // Calcular resultados del usuario
            if (gameState.userBets.length > 0) {
                const lastBet = gameState.userBets[gameState.userBets.length - 1];
                const matches = lastBet.numbers.filter(n => drawn.includes(n)).length;
                const unmatches = 12 - matches;

                let prize = 0;

                if (matches === 12 || unmatches === 0) {
                    prize = 100000;
                } else if (matches === 11 || unmatches === 1) {
                    prize = 1000;
                } else if (matches === 10 || unmatches === 2) {
                    prize = 40;
                } else if (matches === 9 || unmatches === 3) {
                    prize = 4;
                }

                if (prize > 0) {
                    gameState.userBalance += prize;
                    showWinning(prize);
                }

                gameState.gameHistory.unshift({
                    draw: drawn,
                    userBet: lastBet.numbers,
                    matches,
                    prize,
                    timestamp: new Date()
                });
                if (gameState.gameHistory.length > 10) {
                    gameState.gameHistory.pop();
                }
            }

            // IA hace apuestas
            generateAIBets(drawn);
            updateUI();
        }

        // Generar apuestas IA
        function generateAIBets(lastDraw) {
            gameState.aiPlayers = gameState.aiPlayers.map(player => {
                const numbers = generateRandomNumbers();
                const matches = numbers.filter(n => lastDraw.includes(n)).length;
                const unmatches = 12 - matches;

                let prize = 0;
                if (matches === 12 || unmatches === 0) {
                    prize = 100000;
                } else if (matches === 11 || unmatches === 1) {
                    prize = 1000;
                } else if (matches === 10 || unmatches === 2) {
                    prize = 40;
                } else if (matches === 9 || unmatches === 3) {
                    prize = 4;
                }

                return {
                    ...player,
                    balance: player.balance - 100 + prize,
                    bets: [{ matches, prize }],
                    numbers: numbers
                };
            });
        }

        // Mostrar ganancia
        function showWinning(amount) {
            const notification = document.createElement('div');
            notification.className = 'winning-notification';
            notification.textContent = `¡GANASTE S/ ${amount.toLocaleString()}!`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Formatear tiempo
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Toggle AI info
        function toggleAIInfo(playerId) {
            if (gameState.expandedAI === playerId) {
                gameState.expandedAI = null;
            } else {
                gameState.expandedAI = playerId;
            }
            updateUI();
        }

        // Actualizar UI
        function updateUI() {
            // Actualizar números seleccionados
            const buttons = document.querySelectorAll('.number-btn');
            buttons.forEach((btn, i) => {
                const num = i + 1;
                if (gameState.selectedNumbers.includes(num)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Actualizar contador
            document.getElementById('selectedCount').textContent = gameState.selectedNumbers.length;
            document.getElementById('bettingBtn').disabled = gameState.selectedNumbers.length !== 12;

            // Actualizar balance
            document.getElementById('userBalance').textContent = gameState.userBalance.toLocaleString();
            document.getElementById('betAmount').value = gameState.betAmount;
            document.getElementById('betDisplay').textContent = gameState.betAmount.toLocaleString();

            // Actualizar mi apuesta actual
            const myBetDisplay = document.getElementById('myBetDisplay');
            if (gameState.selectedNumbers.length > 0) {
                myBetDisplay.innerHTML = `
                    <div class="bet-display">
                        <div class="bet-amount-info">
                            <span class="bet-amount-label">Apuesta: S/ ${gameState.betAmount}</span>
                            <span style="color: #27ae60; font-weight: bold;">${gameState.selectedNumbers.length}/12</span>
                        </div>
                        <div class="selected-numbers-display">
                            ${gameState.selectedNumbers.map(num => 
                                `<div class="selected-num-badge" onclick="toggleNumber(${num})" title="Click para eliminar">${num}</div>`
                            ).join('')}
                        </div>
                        <p style="margin-top: 0.8rem; font-size: 0.75rem; color: #999; text-align: center;">Click en un número para eliminarlo</p>
                    </div>
                `;
            } else {
                myBetDisplay.innerHTML = '<div class="no-bet-yet">Selecciona 12 números para hacer una apuesta</div>';
            }

            // Actualizar números sorteados
            const drawnDiv = document.getElementById('drawnNumbers');
            if (gameState.drawnNumbers.length > 0) {
                drawnDiv.innerHTML = gameState.drawnNumbers.map(num =>
                    `<div class="drawn-number">${num}</div>`
                ).join('');
            }

            // Actualizar jugadores IA
            const aiList = document.getElementById('aiPlayersList');
            aiList.innerHTML = gameState.aiPlayers.map(player => {
                const isExpanded = gameState.expandedAI === player.id;
                return `
                    <div class="player-card ${isExpanded ? 'expanded' : ''}" onclick="toggleAIInfo(${player.id})">
                        <div class="player-name">${player.name}</div>
                        <div class="player-balance">S/ ${player.balance.toLocaleString()}</div>
                        ${player.bets.length > 0 ? `
                            <div class="player-bet-info">
                                <span>${player.bets[0].matches} aciertos</span>
                                ${player.bets[0].prize > 0 ? `<span class="bet-win">+S/ ${player.bets[0].prize}</span>` : '<span style="color: #999;">-</span>'}
                            </div>
                        ` : ''}
                        ${isExpanded && player.numbers.length > 0 ? `
                            <div class="player-numbers">
                                <h4>Sus Números:</h4>
                                <div class="player-numbers-display">
                                    ${player.numbers.map(num => {
                                        const isMatch = gameState.drawnNumbers.includes(num);
                                        return `<div class="player-num ${isMatch ? 'match' : ''}">${num}</div>`;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Actualizar histórico
            const statsList = document.getElementById('statsList');
            if (gameState.gameHistory.length === 0) {
                statsList.innerHTML = '<div class="no-history">Sin histórico aún</div>';
            } else {
                statsList.innerHTML = gameState.gameHistory.map((stat, idx) =>
                    `<div class="stat-item ${stat.prize > 0 ? 'win' : ''}">
                        <div><span class="stat-matches">${stat.matches} aciertos</span>
                        ${stat.prize > 0 ? `<span class="stat-prize"> +S/ ${stat.prize}</span>` : ''}</div>
                        <div class="stat-time">${stat.timestamp.toLocaleTimeString()}</div>
                        <div class="stat-details">
                            <p>📊 Sorteados: ${stat.draw.join(', ')}</p>
                            <p>🎯 Tus números: ${stat.userBet.join(', ')}</p>
                        </div>
                    </div>`
                ).join('');
            }
        }

        // Timer principal
        function startTimer() {
            setInterval(() => {
                if (gameState.nextDrawTime <= 0) {
                    performDraw();
                    gameState.nextDrawTime = 300;
                } else {
                    gameState.nextDrawTime--;
                }
                document.getElementById('timerValue').textContent = formatTime(gameState.nextDrawTime);
            }, 1000);
        }

        // Inicializar
        initNumbersGrid();
        updateUI();
        startTimer();
    </script>
</body>
</html>
